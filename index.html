<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 상세</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        .complete-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 상단 네비게이션 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #111;
        }
        .back-btn, .close-btn {
            font-size: 22px;
            cursor: pointer;
            color: #333;
        }

        /* 체크 아이콘 */
        .success-icon-area {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            margin-bottom: 24px;
        }
        .circle-check {
            width: 64px;
            height: 64px;
            background-color: #00d2c4; /* 위버스 민트/청록색 */
            color: white;
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* 완료 텍스트 */
        .success-message {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 40px;
        }

        /* 하단 정보 카드 */
        .info-card {
            background-color: #f9f9f9;
            margin: 0 20px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .artist-name {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }
        .event-title {
            font-size: 17px;
            font-weight: 700;
            color: #111;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="complete-container">
        <!-- 상단 닫기/뒤로가기 버튼 영역 -->
        <div class="top-nav">
            <span class="back-btn">&lt;</span>
            <span class="title">신청 상세</span>
            <span class="close-btn">&times;</span>
        </div>

        <!-- 중앙 완료 체크 아이콘 -->
        <div class="success-icon-area">
            <div class="circle-check">✓</div>
        </div>

        <!-- 안내 텍스트 -->
        <div class="success-message">
            이벤트 신청이 완료되었습니다
        </div>

        <!-- 하단 정보 카드 -->
        <div class="info-card">
            <div class="artist-name">ENHYPEN</div>
            <div class="event-title">260901 SoundBOMB360° 참여 신청</div>
        </div>
    </div>

</body>
</html>
