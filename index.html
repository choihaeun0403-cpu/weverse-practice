<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위버스 사녹 폼림 연습 사이트 (서버시간 동기화 & 방송 선택)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: #f4f5f7;
      color: #222;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #f8f9fa;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    .badge {
      background-color: #00d2c4;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 12px;
    }

    /* 실시간 표준 서버 시계 및 설정 영역 */
    .timer-box {
      background-color: #161920;
      color: #fff;
      padding: 16px 18px;
      text-align: center;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #00e5d4;
      background-color: rgba(0, 229, 212, 0.12);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 6px;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      background-color: #00e5d4;
      border-radius: 50%;
      display: inline-block;
    }

    .current-time {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .current-time span.ms {
      color: #00e5d4;
      font-size: 24px;
    }

    .offset-controls {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9ca3af;
    }

    .btn-tiny {
      background: #282d38;
      border: 1px solid #3c4252;
      color: #d1d5db;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-tiny:hover {
      background: #373e4d;
    }

    .control-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2a2f3b;
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 13px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
    }

    .control-row label {
      color: #b0b6c2;
      font-size: 12px;
      white-space: nowrap;
    }

    .control-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-panel select,
    .control-panel input[type="time"],
    .control-panel input[type="number"] {
      background: #252a34;
      border: 1px solid #404756;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .control-panel select {
      font-weight: 600;
      color: #00e5d4;
    }

    .control-panel input[type="number"] {
      width: 72px;
      text-align: center;
      font-weight: 700;
      color: #00e5d4;
    }

    .btn-quick {
      background-color: #00b8ad;
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-quick:hover {
      background-color: #009e94;
    }

    /* 본문 카드형 폼 영역 (위버스 실제 UI 스타일) */
    .content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-card {
      background-color: #ffffff;
      border-radius: 14px;
      padding: 18px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      border: 1px solid #eceef0;
    }

    .card-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .card-label span.req {
      color: #666;
      font-weight: 400;
      font-size: 14px;
      margin-left: 2px;
    }

    .card-subtext {
      font-size: 12px;
      color: #8e9299;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-helper {
      font-size: 12px;
      color: #8e9299;
      margin-top: 8px;
    }

    .input-text {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dcdfe4;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }

    .input-text:focus {
      border-color: #00d2c4;
    }

    /* 전화번호 입력 영역 (+82 + 번호 입력) */
    .phone-input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid #dcdfe4;
      border-radius: 8px;
      background-color: #fff;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .phone-input-wrap:focus-within {
      border-color: #00d2c4;
    }

    .country-select {
      border: none;
      background: transparent;
      padding: 13px 10px 13px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #222;
      outline: none;
      cursor: pointer;
    }

    .phone-divider {
      width: 1px;
      height: 20px;
      background-color: #e5e7eb;
    }

    .phone-input {
      flex: 1;
      border: none;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }

    /* 객관식 선택지 스타일 */
    .radio-list {
      display: flex;
      flex-direction: column;
    }

    .radio-item {
      display: flex;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
    }

    .radio-item:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }

    .radio-item input[type="radio"] {
      accent-color: #00d2c4;
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
    }

    .radio-item span {
      font-size: 15px;
      font-weight: 500;
      color: #222;
    }

    /* 약관 동의 카드 */
    .agree-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #222;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f3f5;
    }

    .agree-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #00d2c4;
    }

    .agree-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #555;
      padding-top: 10px;
    }

    /* 하단 버튼 */
    .bottom-area {
      padding: 8px 16px 28px;
      background-color: #f8f9fa;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:disabled {
      background-color: #dcdde1;
      color: #9aa0a6;
      cursor: not-allowed;
    }

    .btn-submit.active {
      background-color: #00d2c4;
      color: #fff;
    }

    .btn-submit.active:hover {
      background-color: #00bfb3;
    }

    .hidden {
      display: none !important;
    }

    /* 완료 화면 스타일 */
    .complete-screen {
      background-color: #ffffff;
      padding: 24px 20px;
      flex: 1;
    }

    .complete-box {
      text-align: center;
      padding: 16px 4px;
    }

    .status-icon {
      width: 64px;
      height: 64px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .status-icon.success {
      background-color: #00d2c4;
    }

    .status-icon.fail {
      background-color: #ff5a5f;
    }

    .complete-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 32px;
    }

    .result-card {
      background-color: #f8f9fa;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .feedback-card {
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .feedback-card.success {
      background-color: #e6fbf9;
      border: 1px solid #99efe8;
      color: #006b63;
    }

    .feedback-card.fail {
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: block;
    }

    .btn-retry {
      background-color: #222;
      color: #fff;
      padding: 15px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더 -->
  <header>
    <h1 id="headerTitle">이벤트 신청</h1>
    <span class="badge">위버스 실전 연습</span>
  </header>

  <!-- 실시간 표준 서버 시계 및 방송/정원 설정 -->
  <div class="timer-box">
    <div class="sync-status" id="syncStatus">
      <span class="sync-dot"></span>
      <span id="syncText">표준 서버 시간 동기화 중...</span>
    </div>
    <div class="current-time" id="clock">00:00:00<span class="ms">.00</span></div>
    
    <div class="offset-controls">
      <span>오차 보정(<span id="offsetDisplay">0.0</span>초):</span>
      <button type="button" class="btn-tiny" onclick="adjustOffset(-100)">-0.1초</button>
      <button type="button" class="btn-tiny" onclick="adjustOffset(100)">+0.1초</button>
      <button type="button" class="btn-tiny" onclick="syncServerTime()">재동기화</button>
    </div>

    <div class="control-panel">
      <div class="control-row">
        <label for="showSelect">목표 방송</label>
        <div class="control-inputs">
          <select id="showSelect">
            <option value="261126 Mnet 엠카운트다운">Mnet 엠카운트다운</option>
            <option value="261127 KBS 뮤직뱅크" selected>KBS 뮤직뱅크</option>
            <option value="261128 MBC 쇼! 음악중심">MBC 쇼! 음악중심</option>
            <option value="261129 SBS 인기가요">SBS 인기가요</option>
          </select>
        </div>
      </div>

      <div class="control-row">
        <label>오픈 시각</label>
        <div class="control-inputs">
          <input type="time" id="targetTimeInput" step="1">
          <button type="button" class="btn-quick" id="set10SecBtn">10초 뒤 설정</button>
        </div>
      </div>

      <div class="control-row">
        <label for="capacityInput">모집 정원</label>
        <div class="control-inputs">
          <input type="number" id="capacityInput" value="350" min="10" max="5000" step="10">
          <span style="color:#ccc; font-size:12px;">명</span>
        </div>
      </div>
    </div>
  </div>

  <!-- [1단계] 개인정보 입력 + 객관식 선택지 통합 폼 화면 -->
  <div id="formStep" class="content">
    <!-- 신청자 이름 -->
    <div class="form-card">
      <label class="card-label" for="userName">신청자 이름을 입력해 주세요. <span class="req">(필수)</span></label>
      <input type="text" id="userName" class="input-text" placeholder="신분증과 동일한 이름 입력">
    </div>

    <!-- 전화번호 입력 칸 -->
    <div class="form-card">
      <label class="card-label" for="userPhone">전화번호를 입력해 주세요. <span class="req">(필수)</span></label>
      <div class="phone-input-wrap">
        <select id="countryCode" class="country-select">
          <option value="+82" selected>+82</option>
          <option value="+81">+81</option>
          <option value="+1">+1</option>
        </select>
        <div class="phone-divider"></div>
        <input type="tel" id="userPhone" class="phone-input" maxlength="11" placeholder="01012345678 ('-' 제외)">
      </div>
    </div>

    <!-- 생년월일 입력 칸 -->
    <div class="form-card">
      <label class="card-label" for="userBirth">생년월일을 입력해 주세요. <span class="req">(필수)</span></label>
      <div class="card-subtext">신청 일자를 기준으로 만 15세 이상만 신청할 수 있습니다.</div>
      <input type="text" id="userBirth" class="input-text" maxlength="8" placeholder="예: 20050815">
      <div class="card-helper">연, 월, 일 순으로 입력해 주세요.</div>
    </div>

    <!-- 참여를 희망하는 이벤트명 객관식 선택지 -->
    <div class="form-card">
      <label class="card-label">참여를 희망하는 이벤트명 선택 <span class="req">(필수)</span></label>
      <div class="card-subtext">하나만 선택할 수 있습니다. (목표: <strong id="targetHintText" style="color:#00a89d;">261127 KBS 뮤직뱅크</strong>)</div>
      <div class="radio-list" id="radioList">
        <!-- JS에서 선택지가 생성됩니다 -->
      </div>
    </div>

    <!-- 개인정보 수집 및 이용 동의 -->
    <div class="form-card">
      <label class="agree-row">
        <input type="checkbox" id="agreeCheck">
        <span>이용약관을 확인했으며, 개인정보 수집·이용 및 제공에 동의합니다.</span>
      </label>
      <div class="agree-sub">
        <span>개인정보 수집 이용 동의</span>
        <span>∨</span>
      </div>
      <div class="agree-sub">
        <span>개인정보 제3자 제공 동의</span>
        <span>∨</span>
      </div>
    </div>
  </div>

  <div id="formFooter" class="bottom-area">
    <button type="button" id="finalSubmitBtn" class="btn-submit" disabled>신청 오픈까지 10초 전</button>
  </div>

  <!-- [2단계] 신청 상세 및 완료 피드백 화면 -->
  <div id="completeStep" class="complete-screen hidden">
    <div class="complete-box">
      <div class="status-icon" id="statusIcon">✓</div>
      <div class="complete-title" id="completeTitle">이벤트 신청이 완료되었습니다</div>

      <div class="result-card" id="resultSummary"></div>
      <div class="feedback-card" id="feedbackBox"></div>

      <button type="button" class="btn-retry" id="retryBtn">다시 연습하기 (10초 뒤 오픈)</button>
    </div>
  </div>
</div>

<script>
  const clockEl = document.getElementById('clock');
  const syncText = document.getElementById('syncText');
  const offsetDisplay = document.getElementById('offsetDisplay');
  const showSelect = document.getElementById('showSelect');
  const targetHintText = document.getElementById('targetHintText');
  const radioList = document.getElementById('radioList');
  const headerTitle = document.getElementById('headerTitle');

  const targetTimeInput = document.getElementById('targetTimeInput');
  const set10SecBtn = document.getElementById('set10SecBtn');
  const capacityInput = document.getElementById('capacityInput');
  
  const formStep = document.getElementById('formStep');
  const formFooter = document.getElementById('formFooter');
  const finalSubmitBtn = document.getElementById('finalSubmitBtn');

  const completeStep = document.getElementById('completeStep');
  const statusIcon = document.getElementById('statusIcon');
  const completeTitle = document.getElementById('completeTitle');
  const resultSummary = document.getElementById('resultSummary');
  const feedbackBox = document.getElementById('feedbackBox');
  const retryBtn = document.getElementById('retryBtn');

  // 실제 위버스 폼처럼 함정 선택지를 포함한 목록 구성
  const DECOY_OPTIONS = [
    "I Want You",
    "ENGENE"
  ];

  let serverOffsetMs = 0;
  let targetTimestamp = null;

  function getServerNow() {
    return new Date(Date.now() + serverOffsetMs);
  }

  async function syncServerTime() {
    syncText.textContent = "서버 표준시 측정 중...";
    try {
      const t0 = Date.now();
      const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Seoul', { cache: 'no-store' });
      const t1 = Date.now();
      const data = await response.json();
      
      const rtt = (t1 - t0) / 2;
      const serverTime = new Date(data.datetime).getTime() + rtt;
      serverOffsetMs = Math.round(serverTime - t1);

      syncText.textContent = `위버스/표준 서버시 동기화 완료 (오차 ${serverOffsetMs}ms 반영)`;
      updateOffsetDisplay();
      setTargetSecondsFromNow(10);
    } catch (e) {
      serverOffsetMs = 0;
      syncText.textContent = "기기 표준시 모드 (자동 시간 설정 권장)";
      updateOffsetDisplay();
    }
  }

  function adjustOffset(deltaMs) {
    serverOffsetMs += deltaMs;
    updateOffsetDisplay();
  }

  function updateOffsetDisplay() {
    offsetDisplay.textContent = (serverOffsetMs / 1000).toFixed(1);
  }

  // 객관식 선택지 생성 (목표 방송 + 함정 선택지 배치)
  function renderRadioOptions() {
    const selectedShow = showSelect.value;
    targetHintText.textContent = selectedShow;

    const options = [DECOY_OPTIONS[0], selectedShow, DECOY_OPTIONS[1]];
    radioList.innerHTML = options.map(opt => `
      <label class="radio-item">
        <input type="radio" name="schedule" value="${opt}">
        <span>${opt}</span>
      </label>
    `).join('');
  }

  showSelect.addEventListener('change', renderRadioOptions);

  function setTargetSecondsFromNow(seconds) {
    const now = getServerNow();
    const target = new Date(now.getTime() + seconds * 1000);
    target.setMilliseconds(0);
    targetTimestamp = target.getTime();

    const hh = String(target.getHours()).padStart(2, '0');
    const mm = String(target.getMinutes()).padStart(2, '0');
    const ss = String(target.getSeconds()).padStart(2, '0');
    targetTimeInput.value = `${hh}:${mm}:${ss}`;
  }

  targetTimeInput.addEventListener('change', () => {
    if (!targetTimeInput.value) return;
    const [hh, mm, ss = 0] = targetTimeInput.value.split(':').map(Number);
    const target = getServerNow();
    target.setHours(hh, mm, ss, 0);
    targetTimestamp = target.getTime();
  });

  set10SecBtn.addEventListener('click', () => {
    setTargetSecondsFromNow(10);
  });

  // 초기 실행
  renderRadioOptions();
  setTargetSecondsFromNow(10);
  syncServerTime();

  // 실시간 시계 루프
  function updateClock() {
    const now = getServerNow();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const ms = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, '0');

    clockEl.innerHTML = `${hh}:${mm}:${ss}<span class="ms">.${ms}</span>`;

    if (targetTimestamp && now.getTime() >= targetTimestamp) {
      if (finalSubmitBtn.disabled) {
        finalSubmitBtn.disabled = false;
        finalSubmitBtn.classList.add('active');
        finalSubmitBtn.textContent = '신청하기';
      }
    } else {
      if (!finalSubmitBtn.disabled) {
        finalSubmitBtn.disabled = true;
        finalSubmitBtn.classList.remove('active');
      }
      const remain = Math.ceil((targetTimestamp - now.getTime()) / 1000);
      finalSubmitBtn.textContent = `신청 오픈까지 ${remain > 0 ? remain : 0}초 전`;
    }

    requestAnimationFrame(updateClock);
  }
  requestAnimationFrame(updateClock);

  // 신청하기 버튼 클릭 시 검증 및 완료 화면 전환
  finalSubmitBtn.addEventListener('click', () => {
    const userName = document.getElementById('userName').value.trim();
    const countryCode = document.getElementById('countryCode').value;
    const userPhone = document.getElementById('userPhone').value.trim();
    const userBirth = document.getElementById('userBirth').value.trim();
    const selectedSchedule = document.querySelector('input[name="schedule"]:checked');
    const isAgreed = document.getElementById('agreeCheck').checked;

    if (!userName) {
      alert('신청자 이름을 입력해 주세요.');
      return;
    }
    if (!userPhone) {
      alert('전화번호를 입력해 주세요.');
      return;
    }
    if (!userBirth) {
      alert('생년월일 8자리를 입력해 주세요.');
      return;
    }
    if (!selectedSchedule) {
      alert('참여를 희망하는 이벤트명을 선택해 주세요.');
      return;
    }
    if (!isAgreed) {
      alert('개인정보 수집·이용 및 제공에 동의해 주세요.');
      return;
    }

    const finishTime = getServerNow().getTime();
    const totalElapsed = (finishTime - targetTimestamp) / 1000;

    const capacity = Math.max(10, parseInt(capacityInput.value, 10) || 350);
    const targetShow = showSelect.value;

    const minHumanTime = 0.25;
    const cutoffTime = Number((minHumanTime + (capacity / 100) * 0.65).toFixed(2));

    let estimatedRank;
    if (totalElapsed <= minHumanTime) {
      estimatedRank = Math.max(1, Math.floor((totalElapsed / minHumanTime) * 15));
    } else {
      estimatedRank = Math.floor(((totalElapsed - minHumanTime) / (cutoffTime - minHumanTime)) * capacity);
    }
    if (estimatedRank < 1) estimatedRank = 1;

    const isSuccess = totalElapsed <= cutoffTime;
    const diffSec = Math.abs(totalElapsed - cutoffTime).toFixed(2);
    const isCorrectOption = selectedSchedule.value === targetShow;

    headerTitle.textContent = '신청 상세';

    if (isSuccess && isCorrectOption) {
      statusIcon.className = 'status-icon success';
      statusIcon.textContent = '✓';
      completeTitle.textContent = '이벤트 신청이 완료되었습니다';
    } else if (!isCorrectOption) {
      statusIcon.className = 'status-icon fail';
      statusIcon.textContent = '!';
      completeTitle.textContent = '신청 완료 (선택지 오답)';
    } else {
      statusIcon.className = 'status-icon fail';
      statusIcon.textContent = '✕';
      completeTitle.textContent = '이벤트 신청이 완료되었습니다 (정원 초과)';
    }

    resultSummary.innerHTML = `
      <div>• <strong>신청자:</strong> ${userName} (${userBirth})</div>
      <div>• <strong>연락처:</strong> ${countryCode} ${userPhone}</div>
      <div>• <strong>선택 이벤트:</strong> ${selectedSchedule.value} ${isCorrectOption ? '✅' : '❌(오답)'}</div>
      <div>• <strong>설정 정원 / 예상 등수:</strong> ${capacity}명 중 <strong>약 ${estimatedRank}등</strong></div>
      <div>• <strong>클릭 소요 시간:</strong> <strong>${totalElapsed.toFixed(2)}초</strong> (정원 마감 컷: ${cutoffTime}초)</div>
    `;

    if (!isCorrectOption) {
      feedbackBox.className = 'feedback-card fail';
      feedbackBox.innerHTML = `
        <span class="feedback-title">⚠️ 이벤트 선택 오류 피드백</span>
        목표 이벤트는 <strong>[${targetShow}]</strong>입니다. 정각 전에 미리 이름, 전화번호, 생년월일, 이벤트 선택 및 동의 체크까지 모두 완료해 두세요!
      `;
    } else if (isSuccess) {
      feedbackBox.className = 'feedback-card success';
      feedbackBox.innerHTML = `
        <span class="feedback-title">🎉 합격 안정권! (커트라인보다 ${diffSec}초 빠름)</span>
        • 정각 오픈 후 제출 반응 속도: <strong>${totalElapsed.toFixed(2)}초</strong><br>
        미리 모든 항목을 입력·체크해 두고 정각에 정확히 누르셨습니다!
      `;
    } else {
      feedbackBox.className = 'feedback-card fail';
      feedbackBox.innerHTML = `
        <span class="feedback-title">⏱️ 정원 안에 들려면 최소 ${diffSec}초 더 빨라야 합니다!</span>
        ${capacity}명 정원 마감 컷(<strong>${cutoffTime}초</strong>)보다 <strong>${diffSec}초</strong> 늦었습니다.<br><br>
        💡 <strong>팁:</strong> 정각이 되기 전에 이름, 전화번호, 생년월일, 이벤트 선택, 약관 동의를 모두 미리 마친 뒤 00초 정각에 <strong>[신청하기]</strong>만 바로 누르는 연습을 해보세요.
      `;
    }

    formStep.classList.add('hidden');
    formFooter.classList.add('hidden');
    completeStep.classList.remove('hidden');
    window.scrollTo(0, 0);
  });

  // 다시 연습하기
  retryBtn.addEventListener('click', () => {
    headerTitle.textContent = '이벤트 신청';
    completeStep.classList.add('hidden');
    formStep.classList.remove('hidden');
    formFooter.classList.remove('hidden');
    setTargetSecondsFromNow(10);
    window.scrollTo(0, 0);
  });
</script>

</body>
</html>
